; NitroWorks ECU - DualCore sprint
;
; Clones BluetoothPairing and splits the firmware across the ESP32's two cores
; per ECU-ADR-004: Bluepad32 + gamepad work on core 0 (btTask), LED + OLED on
; core 1 (uiTask). See docs/STEPS.md for the staged build.

[platformio]
; Windows CreateProcess caps the compiler command line at 32767 chars. The deep
; project path + ~\.platformio includes blow past it, so keep these paths short.
core_dir = C:/pio
build_dir = C:/pio-build/DualCore

[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- Bluepad32 needs a custom Arduino core (see BluetoothPairing / setup guide). ---
platform_packages =
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip

; --- OLED: 1.3" SH1106, driven by Adafruit_SH110X (not SSD1306) - see ECU-ADR-006. ---
lib_deps =
    adafruit/Adafruit SH110X @ ^2.1.11
    adafruit/Adafruit GFX Library @ ^1.11.11

build_flags =
    -D CORE_DEBUG_LEVEL=3
